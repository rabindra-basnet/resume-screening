{% extends "base.html" %}
{% block title %}Screen Resume{% endblock %}
{% block content %}
<h1>Screen Resume</h1>

<div class="card">
  <form id="screen-form">
    <div class="form-group">
      <label>Resume (PDF or DOCX)</label>
      <div class="upload-zone" id="drop-zone">
        <p id="drop-text">Drop PDF or DOCX here or click to select</p>
        <input type="file" id="resume" accept=".pdf,.docx" hidden>
      </div>
    </div>

    <div class="form-group">
      <label>Job Description Source</label>
      <select id="jd-source" onchange="toggleJDInput()">
        <option value="existing">Use existing Job Description</option>
        <option value="inline">Paste Job Description</option>
      </select>
    </div>

    <div id="jd-existing" class="form-group">
      <label for="jd-id">Job Description ID</label>
      <input type="text" id="jd-id" placeholder="Enter JD ID">
    </div>

    <div id="jd-inline" class="form-group" style="display: none;">
      <label for="jd-text">Job Description Text</label>
      <textarea id="jd-text" placeholder="Paste job description here..."></textarea>
    </div>

    <button type="submit" class="btn-primary" id="screen-btn">Screen Resume</button>
  </form>
</div>

<div id="result" style="margin-top: 1.5rem;"></div>
{% endblock %}

{% block scripts %}
<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('resume');
let selectedFile = null;

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) selectFile(fileInput.files[0]); });

function selectFile(file) {
  selectedFile = file;
  document.getElementById('drop-text').textContent = file.name;
  dropZone.style.borderColor = 'var(--success)';
}

function toggleJDInput() {
  const source = document.getElementById('jd-source').value;
  document.getElementById('jd-existing').style.display = source === 'existing' ? '' : 'none';
  document.getElementById('jd-inline').style.display = source === 'inline' ? '' : 'none';
}

document.getElementById('screen-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!selectedFile) { alert('Please select a PDF or DOCX resume'); return; }

  const btn = document.getElementById('screen-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Screening...';

  const formData = new FormData();
  formData.append('resume', selectedFile);

  const source = document.getElementById('jd-source').value;
  if (source === 'existing') {
    const jdId = document.getElementById('jd-id').value.trim();
    if (!jdId) { alert('Enter a JD ID'); btn.disabled = false; btn.textContent = 'Screen Resume'; return; }
    formData.append('jd_id', jdId);
  } else {
    const jdText = document.getElementById('jd-text').value.trim();
    if (!jdText) { alert('Enter job description text'); btn.disabled = false; btn.textContent = 'Screen Resume'; return; }
    formData.append('job_description', jdText);
  }

  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = '<div class="card"><div class="spinner"></div> Analyzing resume...</div>';

  try {
    const data = await apiUpload('/screening', formData);
    renderResult(data);
  } catch (err) {
    resultDiv.innerHTML = `<div class="card" style="border-color: var(--danger);"><p style="color: var(--danger);">Error: ${err.message}</p></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Screen Resume';
  }
});

function renderResult(data) {
  const c = data.candidate || {};
  const e = data.evaluation || {};
  const statusClass = `status-${e.candidate_status || 'pending'}`;

  document.getElementById('result').innerHTML = `
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>${c.name || 'Unknown Candidate'}</h2>
        <span class="status-badge ${statusClass}">${e.candidate_status || 'pending'}</span>
      </div>

      ${c.email ? `<div class="meta-row"><span class="meta-label">Email</span><span>${c.email}</span></div>` : ''}
      ${c.phone ? `<div class="meta-row"><span class="meta-label">Phone</span><span>${c.phone}</span></div>` : ''}
      ${e.experience_years != null ? `<div class="meta-row"><span class="meta-label">Experience</span><span>${e.experience_years} years</span></div>` : ''}

      <div style="margin-top: 1rem;">
        <strong>Skill Match: ${e.skill_match_percentage || 0}%</strong>
        <div class="progress-bar"><div class="progress-fill" style="width: ${e.skill_match_percentage || 0}%"></div></div>
      </div>

      ${e.matched_skills?.length ? `
        <div style="margin-top: 0.75rem;">
          <strong>Matched Skills</strong>
          <div class="skill-list">${e.matched_skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}</div>
        </div>` : ''}

      ${e.missing_skills?.length ? `
        <div style="margin-top: 0.75rem;">
          <strong>Missing Skills</strong>
          <div class="skill-list">${e.missing_skills.map(s => `<span class="skill-tag missing">${s}</span>`).join('')}</div>
        </div>` : ''}

      ${e.weak_skills?.length ? `
        <div style="margin-top: 0.75rem;">
          <strong>Weak Skills (need strengthening)</strong>
          <div class="skill-list">${e.weak_skills.map(s => `<span class="skill-tag weak">${s}</span>`).join('')}</div>
        </div>` : ''}

      ${data.learning_plan ? renderLearningPlan(data.learning_plan) : ''}

      ${e.reason ? `
        <div style="margin-top: 1rem;">
          <strong>Reason</strong>
          <p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">${e.reason}</p>
        </div>` : ''}

      ${c.education?.length ? `
        <div style="margin-top: 1rem;">
          <strong>Education</strong>
          ${c.education.map(ed => `<p style="font-size: 0.875rem;">${ed.degree || ''} ${ed.field_of_study ? 'in ' + ed.field_of_study : ''} — ${ed.institution || ''}</p>`).join('')}
        </div>` : ''}

      ${c.work_history?.length ? `
        <div style="margin-top: 1rem;">
          <strong>Work History</strong>
          ${c.work_history.map(w => `<p style="font-size: 0.875rem;">${w.title || ''} at ${w.company || ''} (${w.years || '?'} years)</p>`).join('')}
        </div>` : ''}

      ${data.model_used ? `<div class="meta-row" style="margin-top: 1rem;"><span class="meta-label">Model</span><span>${data.model_used}</span></div>` : ''}
    </div>`;
}

function renderLearningPlan(lp) {
  const gaps = lp.skill_gaps || [];
  const resources = lp.resources || [];
  if (!gaps.length) return '';
  return `
    <div class="card learning-plan" style="margin-top: 1.5rem; border-color: var(--primary);">
      <h2 style="display:flex; justify-content:space-between; align-items:center;">
        <span>Recommended Learning Plan</span>
        ${lp.total_estimated_hours ? `<span class="meta-label">~${lp.total_estimated_hours}h</span>` : ''}
      </h2>
      <p style="font-size:0.875rem; color:var(--text-secondary); margin-bottom:0.75rem;">
        Based on the skills you're missing or need to strengthen for this role, here's where to start.
      </p>
      ${resources.length ? `
        <div class="skill-list">
          ${resources.map(r => `
            <a href="${r.url || '#'}" target="_blank" rel="noopener noreferrer" class="resource-card">
              <span class="resource-skill">${r.skill}</span>
              <span class="resource-title">${r.title}</span>
              <span class="resource-provider">${r.provider || ''}${r.estimated_hours ? ` · ${r.estimated_hours}h` : ''}</span>
            </a>`
          ).join('')}
        </div>` : ''}
    </div>`;
}
</script>
{% endblock %}
