# Pre-commit hooks for code quality and security hardening.
# Install with: uv run pre-commit install
# Run all hooks with: uv run pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      # Lint with security (S), bugbear (B), blind-except (BLE) rules enabled.
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      # Security scanner for common vulnerability patterns.
      - id: bandit
        args: [-c, pyproject.toml, -ll]
        files: ^app/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-ast

  - repo: local
    hooks:
      - id: pytest
        name: run unit tests
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
